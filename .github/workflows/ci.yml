name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, master, rama-jessuikl, Rama-tobi, rama-tobi ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BeatWatch_BackEnd.Tests/BeatWatch_BackEnd.Tests.csproj

    - name: Dependency Vulnerability Audit
      shell: bash
      run: |
        audit="$(dotnet list BeatWatch_BackEnd/BeatWatch_BackEnd.csproj package --vulnerable --include-transitive --format json)"
        if jq -e '[.. | objects | select(has("vulnerabilities")) | .vulnerabilities[]?] | length > 0' <<< "$audit"; then
          echo "Se detectaron dependencias vulnerables."
          exit 1
        fi

    - name: Configuration scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: config
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: "1"
        ignore-unfixed: true

    - name: Secret scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build project
      run: dotnet build BeatWatch_BackEnd/BeatWatch_BackEnd.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test BeatWatch_BackEnd.Tests/BeatWatch_BackEnd.Tests.csproj --configuration Release --no-restore
      env:
        TEST_MONGODB_CONNECTION_STRING: mongodb://127.0.0.1:27017

  deployment-smoke-test:
    name: Container Deployment Smoke Test
    needs: test-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build and start production container
      run: docker compose -f docker-compose.ci.yml up --build --wait

    - name: Scan container image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: beatwatch-ci-api:latest
        format: table
        severity: HIGH,CRITICAL
        exit-code: "1"
        ignore-unfixed: true

    - name: Verify health endpoint
      run: |
        for attempt in {1..30}; do
          echo "Intento $attempt de 30"

          if curl --fail --silent --show-error \
            http://127.0.0.1:8080/health; then
            echo
            echo "Health endpoint funcionando correctamente"
            exit 0
          fi

          sleep 2
        done

        echo "La API no estuvo disponible después de 60 segundos"
        docker compose -f docker-compose.ci.yml ps
        docker compose -f docker-compose.ci.yml logs api
        exit 1

    - name: Show API logs on failure
      if: failure()
      run: |
        echo "=== API logs ==="
        docker compose -f docker-compose.ci.yml logs api || true

        echo "=== Estado de contenedores ==="
        docker compose -f docker-compose.ci.yml ps || true

    - name: Stop test environment
      if: always()
      run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  publish-image:
    name: Publish Production Image
    needs: deployment-smoke-test
    env:
      SHOULD_PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: env.SHOULD_PUBLISH == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: metadata
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/beatwatch-backend
        tags: |
          type=raw,value=latest
          type=sha,prefix=sha-

    - name: Build and publish image
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: BeatWatch_BackEnd/Dockerfile
        push: ${{ env.SHOULD_PUBLISH == 'true' }}
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        sbom: true
        provenance: mode=max

    - name: Attest build provenance
      if: env.SHOULD_PUBLISH == 'true'
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/beatwatch-backend
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
